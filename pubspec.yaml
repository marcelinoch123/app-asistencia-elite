name: app_asistencia_elite
description: "Aplicación de control de asistencia para Elite Multiservicios SRL"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  provider: ^6.0.5
  intl: ^0.18.1
  table_calendar: ^3.0.9
  fl_chart: ^0.63.0
  geolocator: ^14.0.3
  image_picker: ^1.0.4
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
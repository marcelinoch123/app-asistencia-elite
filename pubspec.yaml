name: app_asistencia_elite
description: "Aplicación de control de asistencia para Elite Multiservicios SRL"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  provider: ^6.0.5
  intl: ^0.18.1
  table_calendar: ^3.0.9
  fl_chart: ^0.63.0
  geolocator: ^14.0.3
  image_picker: ^1.0.4
  flutter_dotenv: ^5.1.0
  image_watermark_editor: ^0.0.1
  image: "<4.5.0"
  http: ^1.6.0
  excel: ^4.0.6
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  google_maps_flutter: ^2.10.0
  csv: ^6.0.0
  pdf: ^3.10.0
  printing: ^5.11.0
  file_picker: ^13.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0F2744"
  adaptive_icon_foreground: "assets/images/app_icon.png"